name: Meridian compatibility

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - meridian-version: "1.7.1"
            backend: tensorflow
          - meridian-version: "2.2.1"
            backend: tensorflow
          - meridian-version: "2.2.1"
            backend: jax
    env:
      MERIDIAN_VERSION: ${{ matrix.meridian-version }}
      MERIDIAN_BACKEND: ${{ matrix.backend }}
      MPLCONFIGDIR: ${{ runner.temp }}/matplotlib

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: "3.11"

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::devtools, local::.
          needs: check

      - name: Provision Meridian
        env:
          RETICULATE_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          mkdir -p "$MPLCONFIGDIR"
          Rscript -e 'devtools::load_all(); meridianR::install_meridian(meridian_version = Sys.getenv("MERIDIAN_VERSION"), backend = Sys.getenv("MERIDIAN_BACKEND"))'

      - name: Use provisioned environment
        run: |
          echo "RETICULATE_PYTHON=$(Rscript -e 'cat(reticulate::virtualenv_python("r-meridian"))')" >> "$GITHUB_ENV"

      - name: Run integration tests
        run: Rscript -e 'devtools::test()'
